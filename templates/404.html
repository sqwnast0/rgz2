{% extends "base.html" %}

{% block title %}Страница не найдена - Склад бытовой техники{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="card border-0 shadow-sm">
            <div class="card-body py-5">
                <div class="display-1 text-muted mb-4">404</div>
                <i class="bi bi-exclamation-triangle display-1 text-warning mb-4"></i>
                <h1 class="h2 mb-3">Страница не найдена</h1>
                <p class="lead text-muted mb-4">
                    Запрошенная страница не существует или была перемещена.
                </p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door"></i> На главную
                    </a>
                    <a href="{{ url_for('products_page') }}" class="btn btn-outline-primary px-4">
                        <i class="bi bi-box-seam"></i> К товарам
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left"></i> Назад
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
